[package]
name = "valhalla-debug"
description = "Debug tool for Valhalla routing engine"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["kinkard"]
repository = "https://github.com/kinkard/valhalla-debug"

[profile.release]
strip = true
lto = "thin"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
maud = { version = "0.27", features = ["axum"] }
pmtiles = { version = "0.26", default-features = false, features = ["write"] }
polyline-iter = "0.4"
prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "signal"] }
tower-http = { version = "0.7", features = ["fs", "compression-gzip", "compression-zstd", "set-header"] }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
valhalla = "0.7"
zlib-rs = "0.6"

[dev-dependencies]
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
