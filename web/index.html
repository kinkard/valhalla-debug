<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Valhalla Debug</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b5cad'/%3E%3Cpath d='M9 25c0-7 14-5 14-12 0-3-2-5-5-6' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='25' r='3' fill='%23fff'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700&family=Overpass+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link href="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
    <link href="css/app.css" rel="stylesheet" />
    <link href="css/waypoints.css" rel="stylesheet" />
    <link href="css/params.css" rel="stylesheet" />
    <link href="css/routes.css" rel="stylesheet" />
    <link href="css/speeds.css" rel="stylesheet" />
    <link href="css/profile.css" rel="stylesheet" />
  </head>

  <body>
    <aside id="rail">
      <header class="rail-head">
        <h1>Valhalla debug</h1>
      </header>

      <!-- Each section is owned by one module in web/js/ -->
      <section id="panel-waypoints" class="panel" aria-label="Waypoints"></section>
      <section id="panel-routes" class="panel" aria-label="Routes"></section>
      <section id="panel-params" class="panel" aria-label="Request options"></section>

      <footer id="status" class="status" role="status" aria-live="polite"></footer>
    </aside>

    <main id="map-wrap">
      <div id="map"></div>
      <!-- Floating map controls, top right -->
      <div id="panel-layers" class="float float-tr"></div>
      <!-- Docked at the bottom of the map when an expansion is loaded -->
      <div id="panel-expansion" class="dock" hidden></div>
      <div id="context-menu" class="menu" role="menu" hidden></div>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
